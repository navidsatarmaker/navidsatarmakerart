<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Navid Satarmaker</title>
  <meta name="description" content="Surreal art portfolio by Navid Satarmaker. Clean sketchy line art, minimal shading, and calm contemplation.">

  <!-- Open Graph Preview -->
  <meta property="og:title" content="Portfolio | Navid Satarmaker">
  <meta property="og:description" content="Surreal art portfolio by Navid Satarmaker.">
  <meta property="og:image" content="images/artwork-1-main.webp">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

  <!-- Temporary theme switcher to test light & dark modes (removable for final release) -->
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
    <span class="theme-label">Theme</span>
  </button>

  <main id="gallery" class="gallery">
    <!-- Rendered dynamically by script.js from the artworks array -->
  </main>

  <!-- Timelapse video section -->
  <section class="artwork-section timelapse-section" id="timelapse-section" data-bg-light="#f3f0ea" data-bg-dark="#151518">
    <div class="artwork-stage">
      <div class="video-container">
        <video
          id="timelapse-video"
          class="timelapse-video"
          src="videos/timelapse.mp4"
          poster="videos/timelapse-poster.webp"
          preload="metadata"
          muted
          loop
          playsinline
          aria-label="Timelapse of the drawing process"
        ></video>
      </div>
    </div>
  </section>

  <footer class="contact-footer">
    <a href="mailto:navisatarmaker5@gmail.com" class="email-link">navisatarmaker5@gmail.com</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
